name: Windows build

on:
  push:
    branches:
      - fix/persist-vulkan-pipeline-cache
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install WinLibs GCC 15.2 UCRT SEH
        shell: pwsh
        run: |
          $url = "https://github.com/brechtsanders/winlibs_mingw/releases/download/15.2.0posix-13.0.0-ucrt-r6/winlibs-x86_64-posix-seh-gcc-15.2.0-mingw-w64ucrt-13.0.0-r6.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\winlibs.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\winlibs.zip" -DestinationPath "$env:RUNNER_TEMP\winlibs"
          "$env:RUNNER_TEMP\winlibs\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Configure
        run: |
          g++ --version
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --target libs relinker SonsOfSparta-PS5 --parallel 2
